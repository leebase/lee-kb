            "type": "markdown"
          },
          {
            "path": "code-reviews/review-sprint-3-repair-3.verdict.json",
            "type": "json"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "code-reviews/review-sprint-3-repair-3.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "code-reviews/review-sprint-3-repair-3.md",
            "headings": [
              "Findings",
              "Residual Risks",
              "Verification"
            ]
          },
          {
            "type": "json_schema",
            "path": "code-reviews/review-sprint-3-repair-3.verdict.json",
            "schema_path": "builtin:review_verdict/v1"
          },
          {
            "type": "review_verdict_clean",
            "path": "code-reviews/review-sprint-3-repair-3.verdict.json",
            "severity_threshold": "High"
          }
        ],
        "system": [
          {
            "type": "checks_run_match",
            "path": "code-reviews/review-sprint-3-repair-3.verdict.json",
            "timeout_seconds": 300,
            "advisory": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the review so each prior round-two High finding is independently re-derived with your own constructed probe (both halves of the contradiction fix), the invariant and leak scans are repository-wide, the verdict passes tools/validate_verdict.py, and the required headings and schema fields are present. Keep writes inside code-reviews/.",
        "after_retries_exhausted": "halt"
      }
    }
  ]
