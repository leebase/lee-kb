{
  "playbook_id": "sprint_03_repair_round_three",
  "name": "Sprint 3 repair round three - require positive contradiction, not mere difference",
  "authoring_notes": [
    "Round three. The finding trend is converging: 3 High -> 3 High -> 1 High. Round two fixed the missed-contradiction direction (S3-R-10) but over-corrected into the opposite failure: mere DIFFERENCE between two statements is now reported as conflict.",
    "S3-R-15: the re-review measured this as a controlled A/B against a git archive of the pre-repair tree -- 5 of 6 agreeing pairs now emit a false Conflict, against 1 of 6 before. 'The platform team owns the Perseus runbook.' versus 'The Perseus runbook is owned by the platform team.' is reported as competing because 'owns' != 'owned'.",
    "THIS ROUND MUST BE VALIDATED IN BOTH DIRECTIONS. A fix that only reduces false conflicts and silently reintroduces the merge-a-contradiction failure is a regression, and vice versa. The step therefore requires a two-sided fixture set and an explicitly measured false-positive rate.",
    "Standing context for the approval decision: lexical contradiction detection is what makes this hard. 'owns' versus 'owned' and 'enabled' versus 'turned off' are trivial for a language model and genuinely difficult for term-set comparison. The SynthesisProvider seam exists precisely so an LLM provider can replace this heuristic once a dependency is approved; until then the deterministic path must be conservative and honest about its limits.",
    "Scope is S3-R-15 and the related S3-R-12 Corvus shape the reviewer notes the same fix closes. All other Medium and Low findings remain follow-on work.",
    "The dependency guardrail still binds: zero runtime dependencies, no LLM client."
  ],
