    "require_validation_pass_to_advance": true
  },
  "steps": [
    {
      "step_id": "step_01_positive_contradiction_signal",
      "name": "Require a positive contradiction signal, not set inequality (codex)",
      "routing": {
        "primary": {
          "harness": "codex_cli",
          "model": "gpt-5.6-sol",
          "effort": "high"
        }
      },
      "mission": "Before writing, read AGENTS.md, code-reviews/review-sprint-3-repair-2.md (finding S3-R-15 is the specification and carries a measured A/B), code-reviews/review-sprint-3-repair.md (for what round two was fixing), docs/answer-architecture.md, src/lee_kb/answer_conflict.py, and src/lee_kb/answer.py. Stdlib only, no runtime dependency.\n\nTHE DEFECT. The structural-divergence branch added in round two emits a Conflict whenever two same-topic statements have a meaningful-term Jaccard of at least 0.5 AND unequal term sets. Set inequality is not disagreement. Measured: 5 of 6 agreeing pairs now emit a false Conflict against 1 of 6 before the repair. Paraphrase ('owns' vs 'owned') and elaboration (a sentence plus a qualifying clause) are both reported as competing.\n\nTHE FIX. Require a POSITIVE contradiction signal rather than mere difference. (a) Treat a strict superset of meaningful terms as ELABORATION, not divergence, and apply the same superset rule to the value-word comparison -- the reviewer notes this also closes the pre-existing S3-R-12 Corvus shape. (b) Normalize light morphology (owns/owned, list/listed, retains/retained) before comparing term sets, so a paraphrase is not read as a disagreement; the existing synonym-set structure is the right place for this. (c) Keep a conflict signal firing only when there is affirmative evidence of disagreement: diverging value words after superset and morphology normalization, numeric divergence on the same quantity, differing declared authority on the same subject, or explicit supersession wording.\n\nVALIDATE IN BOTH DIRECTIONS -- this is the acceptance criterion for this step, because the last two rounds each fixed one direction and broke the other. Build a two-sided fixture set in tests/answers/: a NON-COMPETING set of at least six pairs that must produce ZERO conflicts (paraphrase by voice, elaboration by added clause, synonym restatement, differing detail level, same fact from two roots, and one pair differing only in formatting); and a CONTRADICTING set of at least five pairs that must EACH produce exactly one Conflict and two separately cited claims (enabled/turned off, permitted/forbidden, a numeric divergence, a canonical-versus-derived disagreement, and one contradiction phrased entirely outside any word list). Assert both sets in the same test module so neither direction can be improved at the other's expense without a visible failure. Do NOT weaken any existing fixture. Address ONLY S3-R-15 and the S3-R-12 shape it closes. Keep all writes within src/lee_kb/ and tests/.",
      "inputs": [
        "AGENTS.md",
        "code-reviews/review-sprint-3-repair-2.md",
        "code-reviews/review-sprint-3-repair.md",
        "docs/answer-architecture.md",
        "src/lee_kb/answer_conflict.py",
        "src/lee_kb/answer.py",
        "tests/answers/test_answer_benchmarks.py"
      ],
      "allowed_paths": [
        "src/lee_kb/",
        "tests/"
      ],
      "outputs": {
        "required": [
          {
            "path": "src/lee_kb/answer_conflict.py",
            "type": "text"
          },
          {
            "path": "src/lee_kb/answer_absence.py",
            "type": "text"
          },
          {
            "path": "src/lee_kb/answer.py",
            "type": "text"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "src/lee_kb/answer_conflict.py"
          }
        ],
        "system": [
          {
            "type": "command_succeeds",
            "command": "python3 -m pytest tests/",
            "require_collected_tests": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair so conflict requires affirmative evidence of disagreement: supersets are elaboration, morphology is normalized before comparison, and both the non-competing set (zero conflicts) and the contradicting set (one conflict each, two cited claims) pass in the same module. Neither direction may be improved at the other's expense. Keep writes inside src/lee_kb/ and tests/.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_02_verification_and_docs",
      "name": "Full verification and updated benchmark results (sonnet)",
      "mission": "Before writing, read AGENTS.md, skills/documentation.md, docs/answer-benchmark-results.md, code-reviews/review-sprint-3-governed-answer.md, context.md, and result-review.md. First drive full verification green: python3 -m pytest, BLACK_NUM_WORKERS=1 python3 -m black --check src tests tools, python3 -m ruff check src tests tools, python3 -m compileall -q src tests tools, python3 tools/check_disclosure.py, and git diff --check. Then update docs/answer-benchmark-results.md to reflect the repaired behavior: the benchmark families now include the three new regression cases, and the Recommendation must be re-evaluated against the repaired system rather than left stale -- it must be exactly one of 'Ready for customer-facing Q&A', 'Ready after specific follow-up', or 'Not ready', with reasoning. Preserve all seven existing headings (Benchmark Cases, Results, Provenance Examples, Confidence Distribution, Conflict Examples, Performance Observations, Recommendation) with those exact texts. Add a conflict example drawn from the NEW same-authority contradiction fixture, since that is the case the previous document could not demonstrate. Then add a result-review.md top entry describing the three repaired findings and update context.md (Recently Completed, Next Actions Queue). State plainly which review findings remain open (the Medium and Low ones) rather than implying the review is fully resolved. PUBLICATION CONSTRAINT: this repository is public -- no absolute host paths, no private corpus content, nothing credential-shaped. Keep all writes within src/, tests/, tools/, docs/, context.md, and result-review.md.",
      "inputs": [
        "AGENTS.md",
        "skills/documentation.md",
        "docs/answer-benchmark-results.md",
        "code-reviews/review-sprint-3-governed-answer.md",
        "context.md",
        "result-review.md"
      ],
      "allowed_paths": [
        "src/",
        "tests/",
        "tools/",
        "docs/",
        "context.md",
        "result-review.md"
      ],
      "outputs": {
        "required": [
          {
            "path": "docs/answer-benchmark-results.md",
            "type": "markdown"
          },
          {
            "path": "result-review.md",
