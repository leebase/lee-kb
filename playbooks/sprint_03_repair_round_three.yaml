      "on_fail": {
        "retry_message": "Repair whatever blocks full verification and make the benchmark document describe the repaired system, keeping all seven exact headings, adding a conflict example from the new same-authority fixture, and stating which findings remain open. Keep writes inside the named paths.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_03_independent_rereview_round_three",
      "name": "Independent re-review of the repaired answer surface (opus)",
      "routing": {
        "primary": {
          "harness": "claude_code",
          "model": "opus"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/code-review.md, agents/reviewer.md, context.md (Decisions Locked), code-reviews/review-sprint-3-governed-answer.md (the prior review -- its three High findings are what this slice claims to repair), docs/answer-architecture.md, docs/answer-benchmark-results.md, and the delivered source and tests. Act as the independent Reviewer.\n\nRe-derive the prior High finding independently AND measure both directions, because the last two rounds each fixed one direction while breaking the other. Construct your own non-competing pairs and your own contradicting pairs, measure the false-conflict rate and the missed-contradiction rate, and report both numbers in Verification. Do NOT accept a fix that merely widens a word list, and do NOT accept a reduction in false conflicts that silently reintroduces merged contradictions: (1) construct two same-authority sources that directly contradict, and prove they now yield a Conflict AND two separately cited claims -- verify BOTH halves of the fix, since the reviewer's own note was that the merge survives even if detection improves; also prove the merge refusal holds when conflict detection is bypassed; (2) construct a corpus where an unrelated absence-shaped sentence coexists with a real multi-source answer, and prove the substantive claims survive; (3) construct three same-topic sources across two authorities and prove no chunk is cited by more than one claim and no merged claim is resurrected. Do not accept the repair on the strength of the new tests alone -- run your own probes.\n\nThen verify the sprint invariants still hold: answer() composes strictly over governance.retrieve(); every substantive claim carries a resolving citation; the three absence states remain distinguishable and an inaccessible result is never reported as NOT_FOUND; confidence is derived rather than asserted; no runtime dependency was added and no LLM client is imported; and no absolute host path, private corpus content, or credential-shaped detail appears in any tracked file (repository-wide scan for the class, not one pattern -- treat any leak as at least a High finding). Confirm the benchmark document's recommendation matches what you actually observe.\n\nBEFORE YOU FINISH: run 'python3 tools/validate_verdict.py code-reviews/review-sprint-3-repair-3.verdict.json' and fix everything it reports. Create BOTH the prose review code-reviews/review-sprint-3-repair-3.md (exact headings Findings, Residual Risks, Verification) AND the verdict code-reviews/review-sprint-3-repair-3.verdict.json conforming to the builtin review_verdict/v1 schema: top level requires verdict, findings, checks_run, and lenses; every finding requires id, severity, file, location, problem, and proposed_fix (the field is 'proposed_fix', NOT 'fix'); every checks_run entry requires command, exit_code, and summary. Residual Risks must state which prior Medium and Low findings remain open, that the LLM synthesis provider is unimplemented pending dependency approval, and that live filesystem verification is deferred. Keep all writes within code-reviews/.",
      "inputs": [
        "AGENTS.md",
        "skills/code-review.md",
        "agents/reviewer.md",
        "context.md",
        "code-reviews/review-sprint-3-repair-2.md",
        "docs/answer-architecture.md",
        "docs/answer-benchmark-results.md",
        "tools/validate_verdict.py"
      ],
      "allowed_paths": [
        "code-reviews/"
      ],
      "outputs": {
