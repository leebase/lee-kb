      "mission": "Before writing, read AGENTS.md, skills/code-review.md, agents/reviewer.md, context.md (Decisions Locked), docs/answer-architecture.md, docs/answer-benchmark-results.md, and the delivered source and tests. Act as the independent Reviewer. Verify with evidence from the code and by running your own probes: (1) answer() composes strictly over governance.retrieve() and no answer path reaches retrieval, the repository, or the FTS index directly -- prove it, since this is the invariant Sprint 1's S1-R-01 was about; (2) every substantive claim in every benchmark answer carries a citation that resolves to a real knowledge item, and evidence_omitted is genuinely populated rather than always empty; (3) the three absence states are produced from distinguishable inputs and cannot collapse -- construct an inaccessible case and prove it is NOT reported as NOT_FOUND; (4) a detected conflict retains both sides through assembly and no code path silently drops the losing side -- construct one and prove it; (5) confidence is derived, not asserted -- prove an answer built from a single directly-quoted chunk and one built from cross-source synthesis receive different confidence; (6) the benchmark document's claimed results are reproducible from the fixture suite, spot-check at least two independently, and its recommendation is one of the three permitted values; (7) NO runtime dependency was added (pyproject dependencies remain empty) and no LLM client is imported anywhere; (8) NO absolute host path, private corpus content, or credential-shaped detail appears in any tracked file -- run a repository-wide scan for the class, not one pattern, and treat any leak as at least a High finding; (9) the Sprint 1 and 2 invariants still hold (fail-closed principal, permission filtering before evidence assembly, one receipt per released evidence item, governed surface exclusivity, nested-root claiming, health-gated sync). BEFORE YOU FINISH: run 'python3 tools/validate_verdict.py code