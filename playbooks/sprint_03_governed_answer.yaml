      "mission": "Before writing, read AGENTS.md, docs/answer-architecture.md (Absence Semantics and Conflict Handling are the specification), src/lee_kb/answer_contracts.py, src/lee_kb/answer_evidence.py, and src/lee_kb/governance.py. Implement src/lee_kb/answer_absence.py and src/lee_kb/answer_conflict.py, stdlib only.\n\nABSENCE. Support authoritative 'nowhere' answers. The three states must be produced from distinguishable inputs and must NEVER collapse: NOT_FOUND means the governed retrieval ran, the corpus was searched, and nothing matched -- an authoritative absence; INACCESSIBLE means candidates existed but permission filtering removed them (denied_count greater than zero with no released evidence) -- the system must say the principal may not see it rather than claiming nothing exists; UNKNOWN means the question could not be resolved -- for example the requested project holds no synchronized content at all, or the corpus is stale beyond the requested freshness. An authoritative NOT_FOUND must also be able to carry supporting evidence: when the corpus positively states that something was never created (a decision that approves a name but explicitly does not authorize creation), the absence is EVIDENCED and cites that statement, which is a stronger answer than mere silence. Never report INACCESSIBLE as NOT_FOUND -- that would leak the shape of hidden content into a false claim of nonexistence, and it must be covered by a test.\n\nCONFLICT. Identify conflicting evidence rather than silently choosing. Detect when two selected evidence items make competing statements about the same subject -- at minimum, differing declared authority on the same topic, or a newer source that supersedes an older one. Report BOTH sides with their citations. Where possible, state which is newer (by source timestamp) or more authoritative (by declared authority, canonical outranking derived), but record that as an ordering signal only -- the Conflict type must not contain a resolved winner, and no code path may drop the losing side. Write tests/test_answer_absence.py and tests/test_answer_conflict.py covering every state and both conflict signals, including the leak test above and a test that a detected conflict retains both sides through assembly. Keep all writes within src/lee_kb/ and tests/.",
