      "mission": "Before writing, read AGENTS.md, docs/answer-architecture.md, src/lee_kb/answer.py, and tests/golden/test_golden_corpus.py (for the established deterministic-offline harness pattern). Build permanent regression fixtures under tests/answers/ covering all SEVEN required families, each deterministic and offline, each synchronized through the local-file connector into a temporary SQLite projection and answered through the public answer() surface:\n(1) DOCUMENTATION STEWARD SHAPE -- synthetic fixture documents reproducing the real investigation's structure: a naming decision in one root that assigns an official name and identifiers, a blocking gate in a second root whose conditions include work described in the first, and a status note in a third root; the correct answer requires combining all three. Do not copy any real corpus content.\n(2) FUZZY NAME -- the question uses an approximate or partial name ('documentation steward') while the corpus uses the full official name; the answer must still find it.\n(3) CROSS-REPOSITORY SYNTHESIS -- the answer requires claims attributed to at least three distinct roots, and the test asserts multiple distinct source attributions.\n(4) AUTHORITATIVE ABSENCE -- an artifact is named in the corpus but the corpus explicitly states it was never created; the answer must say so, cite the statement, and classify the absence as evidenced NOT_FOUND rather than silence.\n(5) CONFLICTING EVIDENCE -- two roots make competing statements; the answer must report both sides with citations and must not select a winner. Assert that both citations appear.\n(6) DUPLICATE-SOURCE PROTECTION -- the same content appears in several chunks of one document; assert one source cannot dominate the evidence set and the answer does not repeat the same claim.\n(7) PROVENANCE COMPLETENESS -- assert that every substantive claim in every positive fixture carries at least one citation resolving to a real knowledge item, and that evidence_omitted is populated with reasons wherever selection dropped candidates.\nThese are permanent regression fixtures: they must not depend on Lee's private corpus, network, wall-clock time, or filesystem state outside the temporary directory.\n\nIf a fixture surfaces a genuine defect in the answer implementation, you MAY repair src/lee_kb/ to fix it -- the fixtures are this sprint's acceptance criteria, so a real failure must be fixed rather than worked around. Never weaken a fixture to make it pass: if the implementation is wrong, fix the implementation and say so; if the fixture's expectation was wrong, correct the expectation and explain why in a comment. Keep all writes within tests/ and src/lee_kb/.",
