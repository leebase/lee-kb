{
  "playbook_id": "sprint_03_governed_answer",
  "name": "Sprint 3 - The governed answer() surface",
  "authoring_notes": [
    "Objective: turn retrieval into governed answers. Not a chatbot; a trustworthy knowledge service. Every substantive statement must be attributable, absence must be authoritative, conflicts must be surfaced rather than resolved.",
    "DEPENDENCY GUARDRAIL (binding): lee-kb has ZERO runtime dependencies and AGENTS.md requires explicit human approval to add one. No LLM client may be added in this sprint. The answer pipeline is therefore built deterministically behind a SynthesisProvider seam: evidence selection, provenance, absence classification, conflict detection, and confidence classification are all mechanical over the EvidenceBundle and need no model. Only narrative prose generation needs an LLM, and that provider is specified but NOT implemented, pending Lee's dependency approval.",
    "Benchmark case 3 ('filesystem + repository reasoning') is interpreted as corpus-derived reasoning about whether an artifact was ever created -- the deployed decision text itself says a naming decision 'does not approve repository creation'. Answering 'nowhere' from that is synthesis over evidence, not filesystem access. Live filesystem verification is explicitly OUT of scope and must be recorded as a deferred extension, not silently skipped.",
    "Every fixture must be deterministic and offline. The Documentation Steward benchmark is reproduced as synthetic fixture documents with the same SHAPE (a naming decision in one root, a blocking gate in a second, a status note in a third, and an artifact that was named but never created) so it is a permanent regression test that does not depend on Lee's private corpus.",
    "Mixed crew, cost optimized: claude_code opus for the contracts/architecture step and the verdict-gated review; codex_cli gpt-5.6-sol high for the three implementation steps; claude_code sonnet for assembly, CLI, and documentation.",
    "Reviewers must preflight the verdict with tools/validate_verdict.py before finishing.",
    "Do not mix unrelated cleanup into this sprint. Office formats, semantic retrieval, memory optimization, and the repository split are all out of scope."
  ],
