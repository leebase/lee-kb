{
  "playbook_id": "sprint_01_personal_foundation",
  "name": "Sprint 1 - Personal Foundation: local documents to governed lexical evidence in SQLite",
  "authoring_notes": [
    "Mixed crew, cost optimized: claude_code opus only for contracts design and final review; claude_code sonnet for governed build steps; codex_cli gpt-5.6-sol for repository, chunking/retrieval, and golden-corpus implementation to spread seat load. Codex is the fallback for claude steps.",
    "Decisions Locked in context.md are binding: identity model, required project field, append-only sync journal, tombstones, fail-closed principal, receipt fields, schema version, wipe-and-resync.",
    "Office formats (.docx/.xlsx/.pptx) are DEFERRED in this run pending explicit dependency approval (AGENTS.md guardrail). The connector ships a format-handler registry with Markdown and plain-text handlers; the review step must record the office-format gap.",
    "research/employee-zero-kb-reference.md is the only in-repo window into the reference system; workers cannot read sibling repos."
  ],
  "defaults": {
    "worker": "claude_code",
    "routing": {
      "primary": {
        "harness": "claude_code",
        "model": "sonnet"
      },
      "fallback": {
        "harness": "codex_cli",
        "model": "gpt-5.6-sol"
      }
    },
    "retry_policy": {
      "max_attempts": 2,
      "strategy": "rerun_with_validation_feedback"
    }
  },
  "run_policy": {
    "on_step_failure": "halt",
    "require_validation_pass_to_advance": true
  },
  "steps": [
    {
      "step_id": "step_01_define_contracts",
      "name": "S1-01: Define normalized domain contracts (opus)",
      "routing": {
        "primary": {
          "harness": "claude_code",
          "model": "opus"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/development-loop.md, context.md (the Decisions Locked table is binding), sprint-plan.md, architecture.md, product-definition.md, research/employee-zero-kb-reference.md, and research/cerebras.kb. Then: (1) Normalize packaging: rename src/lee-kb/ to src/lee_kb/, update pyproject.toml [project.scripts] to lee_kb.main:main, and update tests/test_bootstrap_cli.py to invoke lee_kb.main; preserve existing CLI behavior. (2) Create docs/sprint-1-contracts.md with the exact headings Identity, Knowledge Item, Chunk, Evidence Bundle, Retrieval Receipt, Synchronization Journal, Permissions, Projects, Freshness, and Open Questions, specifying every field and invariant. (3) Implement src/lee_kb/contracts.py as frozen dataclasses (stdlib only, no new dependencies): knowledge item identity (connector_id, source_object_id) with a REQUIRED project field and tombstone flag; chunk identity (item_id, chunk_ordinal, content_hash); RetrieveRequest with query, principal, top_k, metadata filters (connector, project, date range, document type, tags), freshness requirement, and project; EvidenceBundle carrying per-retriever ranks, citations, and source/sync/retrieval timestamps; RetrievalReceipt with knowledge item ID, chunk ID, content hash, source locator, retrieval timestamp, and principal; journal entry with connector, source object, content hash, previous content hash, change type, and timestamp. (4) Write tests/test_contracts.py covering construction, immutability, required-project enforcement, and receipt field completeness. Keep all writes within docs/, src/, tests/, and pyproject.toml.",
      "inputs": [
        "AGENTS.md",
        "skills/development-loop.md",
        "context.md",
        "sprint-plan.md",
        "architecture.md",
        "product-definition.md",
        "research/employee-zero-kb-reference.md",
        "research/cerebras.kb",
        "pyproject.toml",
        "tests/test_bootstrap_cli.py"
      ],
      "allowed_paths": [
        "docs/",
        "src/",
        "tests/",
        "pyproject.toml"
      ],
      "outputs": {
        "required": [
          {
            "path": "docs/sprint-1-contracts.md",
            "type": "markdown"
          },
          {
            "path": "src/lee_kb/contracts.py",
            "type": "text"
          },
          {
            "path": "tests/test_contracts.py",
            "type": "text"
          }
        ]
