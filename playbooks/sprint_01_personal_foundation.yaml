      "on_fail": {
        "retry_message": "Repair the repository so duplicate-free resync, journal append with previous hash, tombstone exclusion, receipt persistence, and schema version all hold under the targeted tests. Stdlib sqlite3 only; keep writes inside src/lee_kb/ and tests/.",
        "after_retries_exhausted": "halt"
