      "routing": {
        "primary": {
          "harness": "codex_cli",
          "model": "gpt-5.6-sol",
          "effort": "high"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/development-loop.md, docs/sprint-1-contracts.md, src/lee_kb/contracts.py, architecture.md (Persistence, Identity, Synchronization Journal, Deletion sections), and research/employee-zero-kb-reference.md. Implement src/lee_kb/repository.py: a repository interface plus a SQLite implementation (stdlib sqlite3 only) that persists knowledge items (with required project, tombstone flag, content hash, source/sync timestamps), chunks (ordinal, content hash, text) with an FTS5 virtual table over chunk text, permissions metadata, connector sync state/cursors, an append-only synchronization journal, retrieval receipts, and a stored schema version. Use transactions with ON CONFLICT upserts; connector cursors must advance only after successful ingestion; deleting a source object tombstones the item (metadata retained, excluded from ordinary search). Write tests/test_repository.py covering: syncing the same document twice produces no duplicate rows; a changed document updates the projection and appends a journal entry with previous content hash; a tombstoned item is excluded from search but its receipts remain resolvable; schema version is stored and readable. Keep all writes within src/lee_kb/ and tests/.",
