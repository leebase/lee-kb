      "step_id": "step_06_governance_receipts",
      "name": "S1-05: Fail-closed authorization, freshness, and retrieval receipts (sonnet)",
      "mission": "Before writing, read AGENTS.md, skills/retrieval-development.md, docs/sprint-1-contracts.md, src/lee_kb/contracts.py, src/lee_kb/repository.py, src/lee_kb/retrieval.py, and architecture.md (Authorization Layer and Retrieval Surfaces sections). Implement src/lee_kb/governance.py providing the public retrieve() surface that composes permission evaluation, retrieval, evidence assembly, and receipt writing. Invariants: every retrieve() call REQUIRES a principal and raises a typed error without one (fail-closed); permission filtering happens BEFORE evidence assembly so denied content never enters an evidence bundle; the single-user permission model is explicit and extensible (owner principal allowed, unknown principals denied by default); every retrieve() writes a retrieval receipt to the repository with knowledge item ID, chunk ID, content hash, source locator, retrieval timestamp, and principal, including for empty result sets; project scoping is enforced (queries scoped to the requested project only). Write tests/test_governance.py covering: missing principal fails closed; unknown principal receives no evidence; denied evidence never appears in a bundle; a receipt is persisted for every call including empty results; out-of-project evidence is excluded. Keep all writes within src/lee_kb/ and tests/.",
