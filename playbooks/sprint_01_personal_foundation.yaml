      "mission": "Before writing, read AGENTS.md, skills/retrieval-development.md, docs/sprint-1-contracts.md, src/lee_kb/contracts.py, src/lee_kb/repository.py, and architecture.md (Ranking Signals and Retrieval Surfaces sections). Implement src/lee_kb/chunking.py (deterministic, heading-aware Markdown chunking with stable ordinals; plain-text fallback by paragraph; same input always yields identical chunks) and src/lee_kb/retrieval.py (lexical retrieval over the repository FTS5 index using BM25 ranking, deterministic tie-breaking by item recency then stable ID, per-retriever rank recorded on every evidence row, source citations with original source locator, and the source/sync/retrieval freshness triplet on every evidence item). The evidence bundle must match the contracts module. No LLM calls, no new dependencies. Write tests/test_retrieval.py covering: exact-token query returns the expected chunk with citation; ranking is deterministic across repeated runs; per-retriever ranks are populated; freshness metadata is present; empty result sets are handled. Keep all writes within src/lee_kb/ and tests/.",
