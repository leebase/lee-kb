    {
      "step_id": "step_04_local_file_connector",
      "name": "S1-02: Local-file connector with sources.toml-compatible config (sonnet)",
      "mission": "Before writing, read AGENTS.md, skills/connector-development.md, docs/sprint-1-contracts.md, src/lee_kb/contracts.py, src/lee_kb/repository.py, and research/employee-zero-kb-reference.md (Source Configuration section). Implement src/lee_kb/connectors/local_files.py plus a connector contract module src/lee_kb/connectors/base.py with discover, list_changes, fetch, permissions, health, and checkpoint responsibilities. Configuration must parse a TOML source-root shape compatible with the Employee Zero knowledge/sources.toml reference: named roots with path, include patterns, exclude patterns (default-deny: anything not matched by include is out), and authority/trust declarations carried as item metadata. Use stdlib tomllib. Implement a format-handler registry with Markdown and plain-text handlers; do NOT add office-format parsing dependencies (deferred pending explicit approval; leave the registry extension point documented in the module docstring). Content hashing is per-artifact; provenance records absolute source path and file timestamps; incremental sync detects new, changed, and deleted files, and deletion tombstones the item via the repository. Write tests/test_local_connector.py covering initial sync, no-op resync, changed file, deleted file to tombstone, and include/exclude enforcement. Keep all writes within src/lee_kb/ and tests/.",
