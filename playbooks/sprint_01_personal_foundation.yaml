        "primary": {
          "harness": "claude_code",
          "model": "opus"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/code-review.md, agents/reviewer.md, context.md (Decisions Locked), docs/sprint-1-contracts.md, and the delivered source and tests under src/lee_kb/ and tests/. Act as the independent Reviewer role. Verify each product invariant with evidence from the code: authorization is fail-closed and precedes evidence assembly; receipts are written for every retrieval with the locked fields; provenance and the freshness triplet survive end to end; identity follows the locked tuples; project scoping is enforced; the sync journal is append-only; tombstones exclude items from search; no unapproved runtime dependencies were added (stdlib only). Check the golden baseline document reflects the harness results. Create BOTH the prose review code-reviews/review-sprint-1-personal-foundation.md AND the machine-readable verdict code-reviews/review-sprint-1-personal-foundation.verdict.json conforming to the builtin review_verdict/v1 schema (findings with severities, checks run, and an overall verdict; Critical or High findings fail the gate). Create the prose review with the exact headings Findings, Residual Risks, and Verification: list concrete findings with file references or state that no findings were discovered; Residual Risks must include the deferred office-format handlers and any weak spots you identify; Verification must list the commands you ran and their results. Keep all writes within code-reviews/.",
      "inputs": [
        "AGENTS.md",
        "skills/code-review.md",
        "agents/reviewer.md",
        "context.md",
        "docs/sprint-1-contracts.md",
        "docs/golden-baseline.md",
        "result-review.md"
      ],
      "allowed_paths": [
        "code-reviews/"
      ],
      "outputs": {
        "required": [
          {
            "path": "code-reviews/review-sprint-1-personal-foundation.md",
            "type": "markdown"
          },
          {
            "path": "code-reviews/review-sprint-1-personal-foundation.verdict.json",
            "type": "json"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "code-reviews/review-sprint-1-personal-foundation.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "code-reviews/review-sprint-1-personal-foundation.md",
            "headings": [
              "Findings",
              "Residual Risks",
              "Verification"
            ]
          },
          {
            "type": "json_schema",
            "path": "code-reviews/review-sprint-1-personal-foundation.verdict.json",
            "schema_path": "builtin:review_verdict/v1"
          },
          {
            "type": "review_verdict_clean",
            "path": "code-reviews/review-sprint-1-personal-foundation.verdict.json",
            "severity_threshold": "High"
          }
        ],
        "system": [
          {
            "type": "checks_run_match",
            "path": "code-reviews/review-sprint-1-personal-foundation.verdict.json",
            "timeout_seconds": 300,
            "advisory": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the review so every product invariant is verified against actual code with file references, findings are concrete or explicitly absent, and the required headings are present. Keep writes inside code-reviews/.",
        "after_retries_exhausted": "halt"
      }
    }
  ]
