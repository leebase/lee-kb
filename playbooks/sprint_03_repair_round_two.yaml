        "retry_message": "Repair so the merge rule is inverted (merge only on demonstrated equivalence), contradictions outside any word list produce a Conflict and two separate cited claims, numeric divergence is detected, evidenced absence is an additional claim that cannot suppress substantive claims, and the new regression fixtures pass without weakening existing ones. Keep writes inside src/lee_kb/ and tests/.",
        "after_retries_exhausted": "halt"
