    {
      "step_id": "step_02_verification_and_docs",
      "name": "Full verification and updated benchmark results (sonnet)",
      "mission": "Before writing, read AGENTS.md, skills/documentation.md, docs/answer-benchmark-results.md, code-reviews/review-sprint-3-governed-answer.md, context.md, and result-review.md. First drive full verification green: python3 -m pytest, BLACK_NUM_WORKERS=1 python3 -m black --check src tests tools, python3 -m ruff check src tests tools, python3 -m compileall -q src tests tools, python3 tools/check_disclosure.py, and git diff --check. Then update docs/answer-benchmark-results.md to reflect the repaired behavior: the benchmark families now include the three new regression cases, and the Recommendation must be re-evaluated against the repaired system rather than left stale -- it must be exactly one of 'Ready for customer-facing Q&A', 'Ready after specific follow-up', or 'Not ready', with reasoning. Preserve all seven existing headings (Benchmark Cases, Results, Provenance Examples, Confidence Distribution, Conflict Examples, Performance Observations, Recommendation) with those exact texts. Add a conflict example drawn from the NEW same-authority contradiction fixture, since that is the case the previous document could not demonstrate. Then add a result-review.md top entry describing the three repaired findings and update context.md (Recently Completed, Next Actions Queue). State plainly which review findings remain open (the Medium and Low ones) rather than implying the review is fully resolved. PUBLICATION CONSTRAINT: this repository is public -- no absolute host paths, no private corpus content, nothing credential-shaped. Keep all writes within src/, tests/, tools/, docs/, context.md, and result-review.md.",
      "inputs": [
