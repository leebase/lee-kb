  "steps": [
    {
      "step_id": "step_01_invert_merge_and_additive_absence",
      "name": "Invert the merge rule and make evidenced absence additive (codex)",
      "routing": {
        "primary": {
          "harness": "codex_cli",
          "model": "gpt-5.6-sol",
          "effort": "high"
        }
      },
      "mission": "Before writing, read AGENTS.md, code-reviews/review-sprint-3-repair.md (findings S3-R-10 and S3-R-11 are the specification -- each carries an independently constructed probe), code-reviews/review-sprint-3-governed-answer.md (the original findings, for context on what round one attempted), docs/answer-architecture.md, src/lee_kb/answer.py, src/lee_kb/answer_conflict.py, src/lee_kb/answer_absence.py, and src/lee_kb/answer_evidence.py. Implement the re-review's DESIGNS, stdlib only, no runtime dependency. Do not extend the existing word lists -- that approach is what failed.\n\nS3-R-10 -- STOP TREATING CONTRADICTION AS A LEXICAL-MEMBERSHIP TEST. Round one keyed both the conflict signal and the merge refusal to a closed 14-word vocabulary, so a contradiction expressed outside it merges into one SYNTHESIZED claim asserting both sides with zero conflicts -- proven with 'enabled' vs 'turned off' and 'permitted' vs 'forbidden' through the real connector and a real SQLite projection. INVERT THE MERGE RULE in _assemble_initial_claims: merge two evidence items only when their differing meaningful terms are empty or a known synonym set, instead of merging unless a known antonym is seen. Over-conservative merging is always safe -- two unmerged agreeing sources cost only one extra cited claim, whereas one wrongly merged pair produces a self-contradictory claim. Additionally add numeric divergence as a conflict signal (two same-subject statements carrying different numbers for the same quantity). Keep the existing value-word signal as one input among several, not the gate.\n\nS3-R-11 -- MAKE EVIDENCED ABSENCE ADDITIVE, NOT A REPLACEMENT. When the explicit-absence gate passes, the whole answer is currently replaced by that one claim and every other selected evidence item is demoted to evidence_omitted. Both gates are weak (a default relevance threshold one shared term can clear, and a BM25 top-rank accident short documents win), so a short unrelated 'X does not exist' record suppresses a correct two-source answer -- proven as a control/treatment A/B. Assemble claims from the full selected evidence as normal, THEN, if the explicit-absence statement matches, append its cited statement as one more DIRECTLY_EVIDENCED claim in rank order. This preserves the benchmark family 4 guarantee that an explicit 'was never created' is cited rather than silently empty, while making suppression of substantive claims structurally impossible.\n\nAdd regression coverage in tests/answers/ for both: contradictions expressed OUTSIDE any word list (use at least the two pairs the reviewer proved, plus one numeric divergence) asserting a Conflict and two separately cited claims; and an unrelated absence-shaped record coexisting with a real multi-source answer, asserting the substantive claims survive AND the absence statement still appears as its own cited claim. Reproduce the reviewer's probes as tests so they demonstrably fail against the current behavior before your fix. Do NOT weaken any existing fixture. Address ONLY these two findings. Keep all writes within src/lee_kb/ and tests/.",
      "inputs": [
        "AGENTS.md",
        "code-reviews/review-sprint-3-repair.md",
