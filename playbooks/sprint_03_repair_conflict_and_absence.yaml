{
  "playbook_id": "sprint_03_repair_conflict_and_absence",
  "name": "Sprint 3 repair - conflict merging, absence short-circuit, claim reconstitution",
  "authoring_notes": [
    "Repairs the three High findings from code-reviews/review-sprint-3-governed-answer.md, each of which the reviewer reproduced with a constructed probe and one of which reproduces end to end through the shipped `lee-kb ask` CLI.",
    "S3-R-01 is the most serious: two same-authority sources that directly contradict are MERGED into one SYNTHESIZED claim asserting both sides, with zero conflicts reported. That is worse than silently choosing a winner -- the answer states both 'enabled' and 'disabled' as one claim. It violates the invariant written in answer.py's own module docstring.",
    "S3-R-02: the evidenced-absence path runs BEFORE evidence selection and short-circuits the pipeline, so one unrelated sentence matching a generic absence pattern replaces a correct multi-source answer.",
    "S3-R-03: conflict reconstitution is non-transitive, so a merged claim is resurrected and chunks end up cited by two claims at once.",
    "Scope is these three findings and their regression fixtures only. The six Medium and Low findings are follow-on work and must NOT be addressed here.",
    "Mixed crew: codex_cli gpt-5.6-sol high for the repair (it is algorithmic and touches three interacting modules); claude_code sonnet for verification and docs; claude_code opus for the verdict-gated re-review.",
    "The dependency guardrail still binds: zero runtime dependencies, no LLM client."
  ],
  "defaults": {
    "worker": "claude_code",
    "routing": {
      "primary": {
        "harness": "claude_code",
        "model": "sonnet"
      },
      "fallback": {
        "harness": "codex_cli",
        "model": "gpt-5.6-sol"
      }
    },
    "retry_policy": {
      "max_attempts": 2,
      "strategy": "rerun_with_validation_feedback"
    }
  },
  "run_policy": {
    "on_step_failure": "halt",
    "require_validation_pass_to_advance": true
  },
  "steps": [
    {
      "step_id": "step_01_repair_three_high_findings",
      "name": "Repair S3-R-01, S3-R-02, S3-R-03 (codex)",
      "routing": {
        "primary": {
          "harness": "codex_cli",
          "model": "gpt-5.6-sol",
          "effort": "high"
        }
      },
      "mission": "Before writing, read AGENTS.md, code-reviews/review-sprint-3-governed-answer.md (the three High findings are the specification for this step -- each includes a reproduced probe), docs/answer-architecture.md, src/lee_kb/answer.py, src/lee_kb/answer_conflict.py, src/lee_kb/answer_absence.py, and src/lee_kb/answer_evidence.py. Repair exactly these three defects, stdlib only, adding no runtime dependency.\n\nS3-R-01 -- CONTRADICTION MERGED INTO ONE CLAIM. Two sources of the same declared authority that directly contradict each other currently produce no Conflict, and their term overlap clears the similarity threshold so they are merged into a single SYNTHESIZED claim whose text asserts both sides. Two independent fixes are required, because either alone leaves a hole: (a) add a third conflict signal for value-word divergence between same-subject statements, reusing the _VALUE_WORDS set already present in answer_conflict.py (enabled/disabled, required/optional, open/closed, not/never) -- when two same-subject statements carry diverging value words, emit a Conflict regardless of authority or timestamp; (b) independently, refuse to merge two evidence items in _assemble_initial_claims when their value words diverge, whatever the similarity score. The merge is the more dangerous half: it survives even if detection is later improved, so fix it separately rather than relying on (a) to prevent it.\n\nS3-R-02 -- ABSENCE SHORT-CIRCUIT. The evidenced-absence path runs before evidence selection and bypasses select_evidence() entirely, so neither the relevance threshold nor per-source allocation applies and one unrelated absence-shaped sentence can replace a correct answer. Run select_evidence() FIRST and evaluate the explicit-absence check only over selected evidence. Additionally require the absence-bearing sentence itself to clear the same question-term coverage test used by _relevance() in answer_evidence.py rather than sharing a single token, and require the matched chunk to be top-ranked in the governed bundle.\n\nS3-R-03 -- NON-TRANSITIVE RECONSTITUTION. detect_conflicts builds its evidence-to-claim map once, before any reconstitution, so when one conflicting pair splits a merged claim a later pair still resolves to the displaced merged claim, which is then resurrected. Make reconstitution transitive: when a merged claim is split, update the map so every subsequent pair resolves to the reconstituted single-evidence claims, and re-key any already-emitted conflict that referenced the merged claim onto those sides. Then add an invariant to the Answer provenance check that NO chunk may be cited by more than one claim, so this class of defect fails at construction rather than surfacing as duplicated prose.\n\nAdd regression coverage for all three, in tests/answers/: a same-authority contradiction fixture asserting exactly one Conflict and two separate cited claims (never one claim asserting both); an 'absence-shaped sentence present but not responsive to the question' fixture asserting the substantive claims survive; and a three-source fixture (one CANONICAL and two DERIVED on the same topic) asserting exactly one claim per chunk. Reproduce each reviewer probe as a test before fixing, so the tests demonstrably fail against the old behavior. Do NOT weaken any existing fixture to accommodate the new behavior; if an existing expectation was wrong, correct it and explain why in a comment. Address ONLY these three findings -- the Medium and Low findings are out of scope. Keep all writes within src/lee_kb/ and tests/.",
      "inputs": [
        "AGENTS.md",
        "code-reviews/review-sprint-3-governed-answer.md",
        "docs/answer-architecture.md",
        "src/lee_kb/answer.py",
        "src/lee_kb/answer_conflict.py",
        "src/lee_kb/answer_absence.py",
        "src/lee_kb/answer_evidence.py",
        "tests/answers/test_answer_benchmarks.py"
      ],
      "allowed_paths": [
        "src/lee_kb/",
        "tests/"
      ],
      "outputs": {
        "required": [
          {
            "path": "src/lee_kb/answer_conflict.py",
            "type": "text"
          },
          {
            "path": "src/lee_kb/answer_absence.py",
            "type": "text"
          },
          {
            "path": "src/lee_kb/answer.py",
            "type": "text"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "src/lee_kb/answer_conflict.py"
          }
        ],
        "system": [
          {
            "type": "command_succeeds",
            "command": "python3 -m pytest tests/",
            "require_collected_tests": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair all three findings so a same-authority contradiction produces a Conflict AND is never merged into one claim, the evidenced-absence path runs only over selected relevant evidence, reconstitution is transitive with a no-chunk-cited-twice invariant, the three new regression fixtures pass, and no existing fixture was weakened. Keep writes inside src/lee_kb/ and tests/.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_02_verification_and_docs",
      "name": "Full verification and updated benchmark results (sonnet)",
      "mission": "Before writing, read AGENTS.md, skills/documentation.md, docs/answer-benchmark-results.md, code-reviews/review-sprint-3-governed-answer.md, context.md, and result-review.md. First drive full verification green: python3 -m pytest, BLACK_NUM_WORKERS=1 python3 -m black --check src tests tools, python3 -m ruff check src tests tools, python3 -m compileall -q src tests tools, and git diff --check. Then update docs/answer-benchmark-results.md to reflect the repaired behavior: the benchmark families now include the three new regression cases, and the Recommendation must be re-evaluated against the repaired system rather than left stale -- it must be exactly one of 'Ready for customer-facing Q&A', 'Ready after specific follow-up', or 'Not ready', with reasoning. Preserve all seven existing headings (Benchmark Cases, Results, Provenance Examples, Confidence Distribution, Conflict Examples, Performance Observations, Recommendation) with those exact texts. Add a conflict example drawn from the NEW same-authority contradiction fixture, since that is the case the previous document could not demonstrate. Then add a result-review.md top entry describing the three repaired findings and update context.md (Recently Completed, Next Actions Queue). State plainly which review findings remain open (the Medium and Low ones) rather than implying the review is fully resolved. PUBLICATION CONSTRAINT: this repository is public -- no absolute host paths, no private corpus content, nothing credential-shaped. Keep all writes within src/, tests/, tools/, docs/, context.md, and result-review.md.",
      "inputs": [
        "AGENTS.md",
        "skills/documentation.md",
        "docs/answer-benchmark-results.md",
        "code-reviews/review-sprint-3-governed-answer.md",
        "context.md",
        "result-review.md"
      ],
      "allowed_paths": [
        "src/",
        "tests/",
        "tools/",
        "docs/",
        "context.md",
        "result-review.md"
      ],
      "outputs": {
        "required": [
          {
            "path": "docs/answer-benchmark-results.md",
            "type": "markdown"
          },
          {
            "path": "result-review.md",
            "type": "markdown"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "markdown_headings_present",
            "path": "docs/answer-benchmark-results.md",
            "headings": [
              "Benchmark Cases",
              "Results",
              "Provenance Examples",
              "Confidence Distribution",
              "Conflict Examples",
              "Performance Observations",
              "Recommendation"
            ]
          }
        ],
        "system": [
          {
            "type": "command_succeeds",
            "command": "python3 -m pytest",
            "require_collected_tests": true
          },
          {
            "type": "command_succeeds",
            "command": "BLACK_NUM_WORKERS=1 python3 -m black --check src tests tools"
          },
          {
            "type": "command_succeeds",
            "command": "python3 -m ruff check src tests tools"
          },
          {
            "type": "command_succeeds",
            "command": "python3 -m compileall -q src tests tools"
          },
          {
            "type": "command_succeeds",
            "command": "git diff --check"
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair whatever blocks full verification and make the benchmark document describe the repaired system, keeping all seven exact headings, adding a conflict example from the new same-authority fixture, and stating which findings remain open. Keep writes inside the named paths.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_03_independent_rereview",
      "name": "Independent re-review of the repaired answer surface (opus)",
      "routing": {
        "primary": {
          "harness": "claude_code",
          "model": "opus"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/code-review.md, agents/reviewer.md, context.md (Decisions Locked), code-reviews/review-sprint-3-governed-answer.md (the prior review -- its three High findings are what this slice claims to repair), docs/answer-architecture.md, docs/answer-benchmark-results.md, and the delivered source and tests. Act as the independent Reviewer.\n\nRe-derive the three prior High findings independently: (1) construct two same-authority sources that directly contradict, and prove they now yield a Conflict AND two separately cited claims -- verify BOTH halves of the fix, since the reviewer's own note was that the merge survives even if detection improves; also prove the merge refusal holds when conflict detection is bypassed; (2) construct a corpus where an unrelated absence-shaped sentence coexists with a real multi-source answer, and prove the substantive claims survive; (3) construct three same-topic sources across two authorities and prove no chunk is cited by more than one claim and no merged claim is resurrected. Do not accept the repair on the strength of the new tests alone -- run your own probes.\n\nThen verify the sprint invariants still hold: answer() composes strictly over governance.retrieve(); every substantive claim carries a resolving citation; the three absence states remain distinguishable and an inaccessible result is never reported as NOT_FOUND; confidence is derived rather than asserted; no runtime dependency was added and no LLM client is imported; and no absolute host path, private corpus content, or credential-shaped detail appears in any tracked file (repository-wide scan for the class, not one pattern -- treat any leak as at least a High finding). Confirm the benchmark document's recommendation matches what you actually observe.\n\nBEFORE YOU FINISH: run 'python3 tools/validate_verdict.py code-reviews/review-sprint-3-repair.verdict.json' and fix everything it reports. Create BOTH the prose review code-reviews/review-sprint-3-repair.md (exact headings Findings, Residual Risks, Verification) AND the verdict code-reviews/review-sprint-3-repair.verdict.json conforming to the builtin review_verdict/v1 schema: top level requires verdict, findings, checks_run, and lenses; every finding requires id, severity, file, location, problem, and proposed_fix (the field is 'proposed_fix', NOT 'fix'); every checks_run entry requires command, exit_code, and summary. Residual Risks must state which prior Medium and Low findings remain open, that the LLM synthesis provider is unimplemented pending dependency approval, and that live filesystem verification is deferred. Keep all writes within code-reviews/.",
      "inputs": [
        "AGENTS.md",
        "skills/code-review.md",
        "agents/reviewer.md",
        "context.md",
        "code-reviews/review-sprint-3-governed-answer.md",
        "docs/answer-architecture.md",
        "docs/answer-benchmark-results.md",
        "tools/validate_verdict.py"
      ],
      "allowed_paths": [
        "code-reviews/"
      ],
      "outputs": {
        "required": [
          {
            "path": "code-reviews/review-sprint-3-repair.md",
            "type": "markdown"
          },
          {
            "path": "code-reviews/review-sprint-3-repair.verdict.json",
            "type": "json"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "code-reviews/review-sprint-3-repair.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "code-reviews/review-sprint-3-repair.md",
            "headings": [
              "Findings",
              "Residual Risks",
              "Verification"
            ]
          },
          {
            "type": "json_schema",
            "path": "code-reviews/review-sprint-3-repair.verdict.json",
            "schema_path": "builtin:review_verdict/v1"
          },
          {
            "type": "review_verdict_clean",
            "path": "code-reviews/review-sprint-3-repair.verdict.json",
            "severity_threshold": "High"
          }
        ],
        "system": [
          {
            "type": "checks_run_match",
            "path": "code-reviews/review-sprint-3-repair.verdict.json",
            "timeout_seconds": 300,
            "advisory": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the review so each prior High finding is independently re-derived with your own constructed probe (both halves of the contradiction fix), the invariant and leak scans are repository-wide, the verdict passes tools/validate_verdict.py, and the required headings and schema fields are present. Keep writes inside code-reviews/.",
        "after_retries_exhausted": "halt"
      }
    }
  ]
}
