      "on_fail": {
        "retry_message": "Repair the review artifacts so the prose review has at least 40 non-whitespace characters under Checks Run and Lens Notes, the verdict JSON honestly reflects the verified slice, the verdict matches the schema, and every claimed check result matches what the commands actually return. Keep all writes inside code-reviews/.",
        "after_retries_exhausted": "halt",
        "repair": {
          "step_id": "step_07_repair_and_verify_slice",
          "max_cycles": 2
        }
      }
    },
    {
