      "mission": "Before writing, read AGENTS.md and skills/documentation.md, then follow them. Update context.md, result-review.md, sprint-plan.md, and WHERE_AM_I.md for handoff after the review artifacts exist. The handoff must honestly reflect the review verdict — a semantic judge checks the closeout against the verdict artifact and fails this step when they contradict. context.md must include the exact Markdown headings Snapshot and What's Happening Now with at least 80 non-whitespace characters under each required heading. Record any stable architecture decision in architecture.md if needed. Keep all writes within context.md, result-review.md, sprint-plan.md, WHERE_AM_I.md, and architecture.md.",
