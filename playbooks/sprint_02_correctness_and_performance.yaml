      "on_fail": {
        "retry_message": "Repair the review so each claimed repair is proven against actual code and run evidence (including a simulated regression for the baseline assertion), the repository-wide leak check is explicit, the verdict passes tools/validate_verdict.py, and the required headings and schema fields are present. Keep writes inside code-reviews/.",
        "after_retries_exhausted": "halt"
      }
    }
  ]
