        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_06_independent_review",
      "name": "Independent review of the Sprint 2 repairs (opus)",
      "routing": {
        "primary": {
          "harness": "claude_code",
          "model": "opus"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/code-review.md, agents/reviewer.md, context.md (Decisions Locked), code-reviews/review-sprint-2-p1-real-corpus.md (the findings this slice claims to repair), evidence/real-corpus-parity-report.md, and the delivered source and tests. Act as the independent Reviewer. Verify with evidence from the code and the run: (1) S2-R-04 is really fixed -- construct overlapping roots and prove a file is indexed exactly once under a deterministic claiming root, and that the condition is visible to an operator rather than silently resolved; (2) S2-R-03 is really fixed -- prove exactly one discovery pass per sync and that cursor semantics, skip-and-report, tombstoning, and every CLI counter are unchanged; (3) S1-R-16 is really fixed -- prove the baseline assertion fails on a simulated ranking regression, not merely that it passes today, and that the recorded document and the test cannot drift apart silently; (4) the re-measured performance figures are reproducible from the run rather than asserted, and any change in document or chunk counts is explained; (5) NO absolute host path, document content, or personal or credential-shaped detail appears in any tracked file -- run a repository-wide check, not just a spot check, and treat any leak as at least a High finding; (6) the Sprint 1 governed-retrieval invariants still hold (fail-closed principal, permission filtering before evidence assembly, one receipt per released evidence item, governance.retrieve as the only public evidence surface). BEFORE YOU FINISH: run 'python3 tools/validate_verdict.py code-reviews/review-sprint-2-correctness.verdict.json' and fix everything it reports -- two prior review cycles were spent failing the gate on field names rather than review quality. Create BOTH the prose review code-reviews/review-sprint-2-correctness.md (exact headings Findings, Residual Risks, Verification) AND the verdict code-reviews/review-sprint-2-correctness.verdict.json conforming to the builtin review_verdict/v1 schema: top level requires verdict, findings, checks_run, and lenses; every finding requires id, severity, file, location, problem, and proposed_fix (the field is 'proposed_fix', NOT 'fix'); every checks_run entry requires command, exit_code, and summary. Residual Risks must state that office-format support and the curated golden benchmark remain open. Keep all writes within code-reviews/.",
      "inputs": [
        "AGENTS.md",
        "skills/code-review.md",
        "agents/reviewer.md",
        "context.md",
        "code-reviews/review-sprint-2-p1-real-corpus.md",
        "evidence/real-corpus-parity-report.md",
        "tools/validate_verdict.py",
        "result-review.md"
      ],
      "allowed_paths": [
        "code-reviews/"
      ],
      "outputs": {
        "required": [
          {
            "path": "code-reviews/review-sprint-2-correctness.md",
            "type": "markdown"
          },
          {
