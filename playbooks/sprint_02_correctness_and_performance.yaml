            "type": "json"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "code-reviews/review-sprint-2-correctness.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "code-reviews/review-sprint-2-correctness.md",
            "headings": [
              "Findings",
              "Residual Risks",
              "Verification"
            ]
          },
          {
