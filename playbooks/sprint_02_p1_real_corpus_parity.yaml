{
  "playbook_id": "sprint_02_p1_real_corpus_parity",
  "name": "Sprint 2 P1 - Run against the real Employee Zero corpus and measure parity",
  "authoring_notes": [
    "Priority order locked by Lee 2026-08-03: real-corpus information first. This playbook delivers only enough parity to consume the DEPLOYED sources.toml faithfully, then measures. It does not implement Sprint 2 in full.",
    "Mixed crew, cost optimized: codex_cli gpt-5.6-sol high for the matcher/config implementation; claude_code sonnet for reporting and the measurement run; claude_code opus only for the verdict-gated review.",
    "The deployed config is /home/lee/projects/ai-employee-factory/knowledge/sources.toml with 15 roots. Its relative paths ('.', '../agent-orch') resolve from the FACTORY WORKSPACE ROOT (/home/lee/projects/ai-employee-factory), not from the config file's directory. Verified 2026-08-03: all 15 roots exist.",
    "Workers read the corpus through the sandbox's read-only root bind and write ONLY inside the lee-kb workspace. The projection database must live at a gitignored path (*.sqlite is ignored repo-wide).",
    "lee-kb is a PUBLIC GitHub repository. The evidence report carries aggregate statistics only: never document content, never quoted text, never personal detail beyond the structural root names already published in research/employee-zero-kb-reference.md.",
    "Office-format handlers remain unregistered (dependency approval is Lee's Priority 2). This run must QUANTIFY that hole, not close it."
  ],
  "defaults": {
    "worker": "claude_code",
    "routing": {
      "primary": {
        "harness": "claude_code",
        "model": "sonnet"
      },
      "fallback": {
        "harness": "codex_cli",
        "model": "gpt-5.6-sol"
      }
    },
    "retry_policy": {
      "max_attempts": 2,
      "strategy": "rerun_with_validation_feedback"
    }
  },
  "run_policy": {
    "on_step_failure": "halt",
    "require_validation_pass_to_advance": true
  },
  "steps": [
    {
      "step_id": "step_01_config_and_matcher_parity",
      "name": "P1a: Consume the deployed sources.toml faithfully (codex)",
      "routing": {
        "primary": {
          "harness": "codex_cli",
          "model": "gpt-5.6-sol",
          "effort": "high"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/connector-development.md, context.md (Decisions Locked is binding), research/employee-zero-kb-reference.md (Source Configuration and Build Pipeline sections are the parity specification), and src/lee_kb/connectors/local_files.py. The goal is that lee-kb can consume the DEPLOYED Employee Zero sources.toml without silently changing its meaning. Implement, with stdlib only: (1) Glob semantics that match the reference implementation: '*' must NOT cross a path separator, '**' matches across separators; 'docs/**/*.md' must match docs/a.md and docs/a/b.md, while '*.md' must match only top-level files. The current fnmatchcase matcher is wrong on both counts -- replace it and test each case explicitly. (2) Per-root '[[roots.<name>.overrides]]' entries of the shape {pattern, authority?, trust?}, first match wins, so individual files are promoted (for example knowledge/faq.md to canonical) inside a derived root. (3) The global default-deny list from the reference: code-reviews/**, .agent-orch/**, .agent-orch-scratch/**, artifacts/**, tmp/**, .kb/**, .git/** -- applied to every root regardless of its own exclude list. (4) Workspace-root-relative path resolution: a new optional 'workspace_root' config key and a 'lee-kb sync --workspace-root PATH' flag; when supplied, relative root paths resolve against it instead of the config file's directory. Preserve the existing config-dir default so current tests keep passing. (5) A 'lee-kb sync --database PATH' flag so the projection can be written somewhere other than the config file's directory. (6) Unsupported or unrecognized config keys must be COLLECTED AND REPORTED, never silently dropped -- silent fidelity loss is the defect class this sprint exists to eliminate. Add tests for every item above in tests/test_local_connector.py or a new test module. Keep all writes within src/lee_kb/ and tests/.",
      "inputs": [
        "AGENTS.md",
        "skills/connector-development.md",
        "context.md",
        "research/employee-zero-kb-reference.md",
        "src/lee_kb/connectors/local_files.py",
        "src/lee_kb/main.py",
        "tests/test_local_connector.py"
      ],
      "allowed_paths": [
        "src/lee_kb/",
        "tests/"
      ],
      "outputs": {
        "required": [
          {
            "path": "src/lee_kb/connectors/local_files.py",
            "type": "text"
          },
          {
            "path": "src/lee_kb/main.py",
            "type": "text"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "src/lee_kb/connectors/local_files.py"
          }
        ],
        "system": [
          {
            "type": "command_succeeds",
            "command": "python3 -m pytest tests/",
            "require_collected_tests": true
          },
          {
            "type": "command_succeeds",
            "command": "env PYTHONPATH=src python3 -m lee_kb.main sync --help"
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair config and matcher parity so glob semantics distinguish '*' from '**', per-root overrides apply first-match-wins, the global default-deny list is enforced, --workspace-root and --database resolve correctly, unsupported config keys are reported rather than dropped, and the full suite passes. Keep writes inside src/lee_kb/ and tests/.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_02_silent_loss_reporting",
      "name": "P1b: Make every dropped document visible (sonnet)",
      "mission": "Before writing, read AGENTS.md, skills/connector-development.md, code-reviews/review-sprint-1-personal-foundation.md (Residual Risks: office formats are silently invisible), research/employee-zero-kb-reference.md (Build Pipeline), src/lee_kb/connectors/local_files.py, and src/lee_kb/main.py. A document that a user expects to be searchable must never disappear without a count. Implement, stdlib only: (1) Unhandled-format reporting: a file that matches a root's include patterns but has no registered FORMAT_HANDLERS entry must be counted per lowercase extension and surfaced through the connector and the CLI sync summary -- this is how Lee learns the true size of the office-format hole before approving parsing dependencies. (2) Git-ignore filtering parity: candidates that git ignores are excluded and counted separately, matching the reference implementation; resolve status per root with a single batched 'git check-ignore -z --stdin' invocation rather than one call per file, and degrade gracefully (count as unresolved, never crash) when a root is not a git repository or git is unavailable. (3) Token-shaped secret skipping: content matching token-shaped patterns is skipped at index time and counted as skipped_token_content, matching the reference implementation -- indexing Lee's real repositories must not pull credentials into the projection. Keep the pattern set small, documented, and conservative. Every counter must reach the CLI sync summary so one command answers 'what did you NOT index, and why?'. Add tests for each counter, including a non-git root and a file containing a token-shaped string. Keep all writes within src/lee_kb/ and tests/.",
      "inputs": [
        "AGENTS.md",
        "skills/connector-development.md",
        "code-reviews/review-sprint-1-personal-foundation.md",
        "research/employee-zero-kb-reference.md",
        "src/lee_kb/connectors/local_files.py",
        "src/lee_kb/main.py"
      ],
      "allowed_paths": [
        "src/lee_kb/",
        "tests/"
      ],
      "outputs": {
        "required": [
          {
            "path": "src/lee_kb/connectors/local_files.py",
            "type": "text"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "src/lee_kb/main.py"
          }
        ],
        "system": [
          {
            "type": "command_succeeds",
            "command": "python3 -m pytest tests/",
            "require_collected_tests": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the reporting so unhandled extensions, git-ignored candidates, and token-skipped content are each counted and surfaced in the CLI sync summary, git-ignore resolution is batched per root and degrades gracefully outside a git repository, and the full suite passes. Keep writes inside src/lee_kb/ and tests/.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_03_real_corpus_measurement",
      "name": "P1c: Sync the real corpus and measure it (sonnet)",
      "mission": "Before acting, read AGENTS.md, skills/test-as-lee.md, context.md, research/employee-zero-kb-reference.md, and docs/golden-baseline.md. This step produces INFORMATION, not polish.\n\nEXECUTION RULE (a previous attempt failed on exactly this): run every command SYNCHRONOUSLY IN THE FOREGROUND and block until it returns. Do NOT background any command, do NOT use run_in_background, do NOT start a task and wait for a completion notification -- this is a one-shot invocation and your turn ending is final. A full sync of the real corpus takes approximately 5-6 minutes of wall clock; that is expected and you must simply wait for it.\n\nRun the delivered CLI against Lee's real deployed configuration. First delete any existing .lee-kb/real-corpus.sqlite so the counts describe a clean full sync, then run, timed:\n  /usr/bin/time -v env PYTHONPATH=src python3 -m lee_kb.main sync --config /home/lee/projects/ai-employee-factory/knowledge/sources.toml --workspace-root /home/lee/projects/ai-employee-factory --database .lee-kb/real-corpus.sqlite\nReading the corpus is permitted and read-only; write nothing outside the lee-kb workspace.\n\nRecord measurements to a scratch file as you obtain them and write the report even if a later measurement fails, so partial information is never lost. Measure and record: total documents and chunks; per-root document counts (query the projection directly with sqlite3); the CLI summary's created/updated/deleted/unchanged/skipped/git-ignored/unresolved/unhandled-extension/token-skipped counters; the unhandled-extension histogram across all roots (this quantifies the office-format hole and is the input to Lee's Priority 2 decision); how many items carry canonical versus derived authority (the deployed config declares 13 override promotions -- verify they actually took effect); wall-clock sync duration AND peak resident memory from /usr/bin/time -v; and projection size on disk.\n\nThen exercise retrieval against the real projection: run at least ten questions spanning the five golden-corpus categories through 'lee-kb search --database .lee-kb/real-corpus.sqlite', recording per-query wall-clock latency, whether governed evidence was returned, and whether the top citation is plausibly the right source. Include at least two deliberately common-word queries to measure the OR-matcher fetch-to-exhaustion behavior the Sprint 1 review flagged (Lee's Priority 5, taken opportunistically while the corpus is loaded).\n\nWrite evidence/real-corpus-parity-report.md with the exact headings Configuration, Corpus Shape, What Was Not Indexed, Retrieval Behavior, Performance, Parity Gaps, and Recommended Next Actions. CRITICAL PUBLICATION CONSTRAINT: lee-kb is a public repository. The report carries aggregate statistics, counts, extensions, timings, and root names only. Never quote document content, never list document titles or file paths beyond root-level names, never include anything personal or credential-shaped. If a measurement cannot be taken, write 'not measured' and say why -- never estimate a number and present it as measured. Keep all writes within evidence/ and .lee-kb/.",
      "inputs": [
        "AGENTS.md",
        "skills/test-as-lee.md",
        "context.md",
        "research/employee-zero-kb-reference.md",
        "docs/golden-baseline.md",
        "src/lee_kb/main.py",
        "src/lee_kb/connectors/local_files.py"
      ],
      "allowed_paths": [
        "evidence/",
        ".lee-kb/"
      ],
      "outputs": {
        "required": [
          {
            "path": "evidence/real-corpus-parity-report.md",
            "type": "markdown"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "evidence/real-corpus-parity-report.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "evidence/real-corpus-parity-report.md",
            "headings": [
              "Configuration",
              "Corpus Shape",
              "What Was Not Indexed",
              "Retrieval Behavior",
              "Performance",
              "Parity Gaps",
              "Recommended Next Actions"
            ]
          }
        ],
        "system": [
          {
            "type": "command_succeeds",
            "command": "python3 -m pytest tests/",
            "require_collected_tests": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the measurement run so every declared metric is either really measured against the real corpus or explicitly marked 'not measured' with a reason, the report carries all required headings, and no document content or personal detail appears anywhere in it. Keep writes inside evidence/ and .lee-kb/.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_04_verification_and_docs",
      "name": "P1d: Full verification green and project memory updated (sonnet)",
      "mission": "Before writing, read AGENTS.md, skills/documentation.md, context.md, sprint-plan.md, WHERE_AM_I.md, result-review.md, and evidence/real-corpus-parity-report.md. First drive full verification green: python3 -m pytest, BLACK_NUM_WORKERS=1 python3 -m black --check src tests, and python3 -m ruff check src tests, repairing whatever they surface. Then update project memory to match delivered reality: add a result-review.md top entry for this P1 slice naming the files and the measured findings; update context.md (Recently Completed, Next Actions Queue re-ranked in light of what the real corpus revealed, open questions refreshed); update WHERE_AM_I.md; and update README.md only if delivered CLI behavior changed (the new --workspace-root and --database flags). State plainly which parity gaps remain open and that office-format handlers are still unregistered pending dependency approval. Do not claim anything is implemented that is not, and do not restate report numbers you have not read in evidence/real-corpus-parity-report.md. Keep all writes within src/, tests/, README.md, context.md, sprint-plan.md, WHERE_AM_I.md, and result-review.md.",
      "inputs": [
        "AGENTS.md",
        "skills/documentation.md",
        "context.md",
        "sprint-plan.md",
        "WHERE_AM_I.md",
        "result-review.md",
        "evidence/real-corpus-parity-report.md"
      ],
      "allowed_paths": [
        "src/",
        "tests/",
        "README.md",
        "context.md",
        "sprint-plan.md",
        "WHERE_AM_I.md",
        "result-review.md"
      ],
      "outputs": {
        "required": [
          {
            "path": "result-review.md",
            "type": "markdown"
          },
          {
            "path": "context.md",
            "type": "markdown"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "result-review.md"
          }
        ],
        "system": [
          {
            "type": "command_succeeds",
            "command": "python3 -m pytest",
            "require_collected_tests": true
          },
          {
            "type": "command_succeeds",
            "command": "BLACK_NUM_WORKERS=1 python3 -m black --check src tests"
          },
          {
            "type": "command_succeeds",
            "command": "python3 -m ruff check src tests"
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair whatever blocks full verification (pytest, black --check, ruff check) and make project memory match delivered behavior and the measured report exactly. Keep writes inside src/, tests/, and the named markdown files.",
        "after_retries_exhausted": "halt"
      }
    },
    {
      "step_id": "step_05_independent_review",
      "name": "P1e: Independent review of the parity slice (opus)",
      "routing": {
        "primary": {
          "harness": "claude_code",
          "model": "opus"
        }
      },
      "mission": "Before writing, read AGENTS.md, skills/code-review.md, agents/reviewer.md, context.md (Decisions Locked), research/employee-zero-kb-reference.md, evidence/real-corpus-parity-report.md, and the delivered source and tests. Act as the independent Reviewer. Verify with evidence from the code and the run: (1) glob semantics really distinguish '*' from '**' and the global default-deny list is enforced for every root; (2) per-root overrides apply first-match-wins and actually change stored authority; (3) unhandled-extension, git-ignored, and token-skipped counters are real, reach the CLI, and are not double-counted; (4) the report's numbers are reproducible from the run rather than asserted -- spot-check at least two independently; (5) NO document content, title, path beyond root names, or personal or credential-shaped detail appears in evidence/real-corpus-parity-report.md, because this repository is public; (6) the projection database is at a gitignored path and no corpus artifact is staged for commit; (7) governed retrieval invariants from Sprint 1 still hold (fail-closed principal, permission filtering before evidence assembly, one receipt per released evidence item, governance.retrieve as the only public evidence surface). Create BOTH the prose review code-reviews/review-sprint-2-p1-real-corpus.md AND the machine-readable verdict code-reviews/review-sprint-2-p1-real-corpus.verdict.json conforming to the builtin review_verdict/v1 schema. VERDICT SCHEMA (a previous attempt failed validation on exactly this -- obey it literally): the top-level object requires verdict, findings, checks_run, and lenses. EVERY entry in findings requires ALL of: id, severity, file, location, problem, and proposed_fix -- the field is named 'proposed_fix', NOT 'fix', and every one must be a non-empty string. EVERY entry in checks_run requires command, exit_code, and summary. Validate the JSON against these requirements before you finish; a schema-invalid verdict fails the step regardless of how good the review is. The prose review must use the exact headings Findings, Residual Risks, and Verification; Residual Risks must state the remaining parity gaps and the still-unregistered office formats. Treat any leakage of personal content into the public report as at least a High finding. Keep all writes within code-reviews/.\n\nCONTEXT FROM THE PRIOR ATTEMPT (its findings are not inherited -- re-derive independently, but do not lose them): the earlier review raised one High finding, S2-R-01, that .agent-orch-scratch/ and .lee-kb/ were untracked AND unignored in this public repository while containing corpus-derived absolute source URIs and query results. That finding was accepted and repaired before this attempt: both directories are now in .gitignore, a stale tracked marker file was untracked, git history was verified clean of corpus artifacts, and git status no longer lists them. Verify that repair independently rather than assuming it.",
      "inputs": [
        "AGENTS.md",
        "skills/code-review.md",
        "agents/reviewer.md",
        "context.md",
        "research/employee-zero-kb-reference.md",
        "evidence/real-corpus-parity-report.md",
        "result-review.md"
      ],
      "allowed_paths": [
        "code-reviews/"
      ],
      "outputs": {
        "required": [
          {
            "path": "code-reviews/review-sprint-2-p1-real-corpus.md",
            "type": "markdown"
          },
          {
            "path": "code-reviews/review-sprint-2-p1-real-corpus.verdict.json",
            "type": "json"
          }
        ]
      },
      "validation": {
        "structural": [
          {
            "type": "file_exists",
            "path": "code-reviews/review-sprint-2-p1-real-corpus.md"
          },
          {
            "type": "markdown_headings_present",
            "path": "code-reviews/review-sprint-2-p1-real-corpus.md",
            "headings": [
              "Findings",
              "Residual Risks",
              "Verification"
            ]
          },
          {
            "type": "json_schema",
            "path": "code-reviews/review-sprint-2-p1-real-corpus.verdict.json",
            "schema_path": "builtin:review_verdict/v1"
          },
          {
            "type": "review_verdict_clean",
            "path": "code-reviews/review-sprint-2-p1-real-corpus.verdict.json",
            "severity_threshold": "High"
          }
        ],
        "system": [
          {
            "type": "checks_run_match",
            "path": "code-reviews/review-sprint-2-p1-real-corpus.verdict.json",
            "timeout_seconds": 300,
            "advisory": true
          }
        ]
      },
      "on_fail": {
        "retry_message": "Repair the review so every claim is verified against actual code and run evidence with file references, the publication-safety check on the public report is explicit, findings are concrete or explicitly absent, and the required headings and verdict schema are present. Keep writes inside code-reviews/.",
        "after_retries_exhausted": "halt"
      }
    }
  ]
}